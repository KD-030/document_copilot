[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.20.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-ai==2.51.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
